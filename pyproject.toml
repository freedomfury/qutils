[project]
name = "qemu-utils"
version = "0.1.0"
description = "A Python abstraction layer for qemu-img"
authors = [
    { name = "Antigravity" }
]
dependencies = [
    "pytest>=8.0.0",
]
requires-python = ">=3.8"
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qemu_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
